services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shadowcoach
      POSTGRES_USER: shadowcoach
      POSTGRES_PASSWORD: shadowcoach
    volumes:
      - shadowcoach-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowcoach -d shadowcoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn shadowcoach_api.main:app --host 0.0.0.0 --port 8000"]
    environment:
      SHADOWCOACH_ENVIRONMENT: development
      SHADOWCOACH_DATABASE_URL: postgresql+asyncpg://shadowcoach:shadowcoach@postgres:5432/shadowcoach
      SHADOWCOACH_JWT_SECRET: development-only-change-before-production-64-byte-secret-value
      SHADOWCOACH_COOKIE_SECURE: "false"
      SHADOWCOACH_CORS_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
      SHADOWCOACH_ALLOWED_HOSTS: '["localhost","127.0.0.1","api","testserver"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  shadowcoach-postgres:
